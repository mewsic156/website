<section id="port">

    <iframe id="dynamicIframe" src=""></iframe>

    <script>
        // Function to get URL parameter by name
        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            var results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }

        // Get the value of 'doc' parameter from the URL
        var docValue = getUrlParameter('doc');

        // Set the src attribute of the iframe if docValue is present
        if (docValue) {
            document.getElementById('dynamicIframe').src = 'file/' + docValue + '.pdf';
        }
    </script>

</section>
